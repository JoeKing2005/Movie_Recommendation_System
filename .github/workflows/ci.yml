name: Test backend and frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Data Visualisation Tests
        working-directory: ./data-visualisation
        run: 
          python3 -m unittest test_preparedata.py

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Backend
        working-directory: ./backend/
        run: |
          npm ci --include=dev
          npm test
